service:
  baseUri: http://0.0.0.0:9000/data-dashboard-backend/
  advertisedBaseUri: http://example.org/data-dashboard-backend/
  enableCors: true

auth:
  managementPortal:
    url: http://localhost:8080/managementportal
    clientId: data_dashboard_api
    clientSecret: data_dashboard_api_secret
  jwtResourceName: res_DataDashboardAPI

database:
  url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=create schema if not exists OBSERVATIONS\; set schema OBSERVATIONS
  user: "sa"
  password:
  dialect: org.hibernate.dialect.H2Dialect
  driver: org.h2.Driver
  liquibase:
    contexts: [dev]
  properties:
    jakarta.persistence.schema-generation.database.action: none
    hibernate.globally_quoted_identifiers: true
    hibernate.physical_naming_strategy: org.radarbase.datadashboard.util.TestHibernateNamingStrategy

variableTypeCache:
  refreshDurationSec: 1800
